name: Deploy to GitHub Pages

# Builds the frontend and publishes it to GitHub Pages on every push to
# main. Uses the official GitHub Pages Actions flow (upload-pages-artifact +
# deploy-pages) rather than a gh-pages branch, so no extra branch or
# personal access token is needed — just the repo's built-in GITHUB_TOKEN.
#
# One-time setup required in the GitHub UI before this workflow can deploy
# anything: Settings -> Pages -> Build and deployment -> Source ->
# "GitHub Actions". See README.md for the full walkthrough.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Nothing is published unless lint, the unit tests and the browser smoke tests all pass.
      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Browser smoke and accessibility tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
