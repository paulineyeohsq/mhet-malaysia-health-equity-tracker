name: CI

# Runs the same checks as the deploy workflow on every pull request, so a failure shows up before merging
# rather than blocking the publish afterwards. Does not deploy anything.

on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Browser smoke and accessibility tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results
          if-no-files-found: ignore

  pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Report-table extraction tests (run against the stored report text, no network)
        run: python3 -m unittest scripts/test_nhms_pdf.py scripts/test_nhms_legacy.py

      - name: The pipeline scripts at least compile
        run: python3 -m py_compile scripts/ingest_data.py scripts/transform_data.py scripts/update_database.py scripts/nhms_pdf.py scripts/nhms_legacy.py scripts/watch_backlog.py

  chat-function:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Chat function behaviour tests
        working-directory: netlify-chat
        run: deno run -A --no-check --import-map=test/import_map.json test/chat.test.ts

      - name: Refresh function behaviour tests
        working-directory: netlify-chat
        run: deno run -A --no-check --import-map=test/import_map.json test/refresh.test.ts

      - name: Shared address and allowed-origin tests
        working-directory: netlify-chat
        run: deno run -A --no-check --import-map=test/import_map.json test/config.test.ts
